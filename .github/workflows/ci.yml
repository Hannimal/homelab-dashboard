name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Screen sleep logic tests
        run: node --test tests/*.test.js
      - name: ShellCheck
        run: shellcheck -S warning deploy.sh install.sh pi/*.sh servers/*.sh
      - name: Validate compose file
        run: docker compose -f servers/docker-compose.yml config -q
      - name: Validate example config
        run: python3 -c "import json;json.load(open('pi/config.example.json'))"
