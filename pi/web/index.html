<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Lab</title>
<style>
  :root {
    --bg: #0B0C0E; --text: #EDEDED; --muted: #8B8F96; --line: #1F2226; --line-soft: #17191C;
    --ok: #6FBF9F; --warn: #E5A54B; --off: #5A5E64; --down: #E2685C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    color: var(--text); font-family: Inter, "Inter Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
    cursor: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* The layout is designed at 800x480 and scaled to whatever the screen is */
  #stage { width: 800px; height: 480px; transform-origin: 0 0; position: absolute; top: 0; left: 0;
           padding: 18px 24px 0; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: none; }

  header { display: flex; align-items: baseline; justify-content: space-between;
           padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  header .title { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  header .sub { font-size: 12px; color: var(--muted); margin-left: 14px; }
  header .clock { font-size: 22px; font-weight: 300; letter-spacing: .02em; }
  header .right { display: flex; align-items: center; gap: 4px; }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { display: none; flex: 1; min-height: 0; }
  .view.active { display: flex; }

  /* Overview */
  #overview { display: none; }
  #overview.active { display: grid; }
  .host { padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 14px;
          border-right: 1px solid var(--line); text-align: left; min-width: 0; }
  .host:first-child { padding-left: 0; }
  .host:last-child { padding-right: 0; border-right: 0; }
  .host .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .host .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .warn .dot, .dot.warn { background: var(--warn); }
  .down .dot, .dot.down { background: var(--down); }
  .dot.off { background: var(--off); }
  .state.warn { color: var(--warn); }
  .state.down { color: var(--down); }
  .big { font-size: 40px; font-weight: 300; line-height: 1; }
  .big small { font-size: 18px; color: var(--muted); }
  .caption { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .metrics { display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
  .metric .row { display: flex; justify-content: space-between; gap: 8px; }
  .metric .row span:first-child { color: var(--muted); }
  .bar { height: 2px; background: var(--line); margin-top: 5px; }
  .bar i { display: block; height: 2px; background: var(--text); }
  .metric.hot .row span:last-child { color: var(--warn); }
  .metric.hot .bar i { background: var(--warn); }
  .foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .foot b { font-weight: 400; color: var(--text); }
  .offline { margin: auto 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

  header .stale { color: var(--down); }
  .statusline { padding: 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
                display: flex; justify-content: space-between; gap: 16px; white-space: nowrap; }
  .statusline .msg { overflow: hidden; text-overflow: ellipsis; }
  .statusline .hl { color: var(--warn); }
  .statusline .bad { color: var(--down); }

  /* Containers */
  #containers { flex-direction: column; }
  .pills { display: flex; gap: 4px; }
  .pill { height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid transparent;
          font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .pill.on { border-color: #3A3E44; background: #1A1C20; color: var(--text); font-weight: 500; }
  .table { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .thead, .tr { display: grid; grid-template-columns: 2.4fr 1.2fr .8fr 1fr .8fr; gap: 8px; align-items: center; }
  .thead { padding: 10px 0 8px; font-size: 11px; color: var(--muted); }
  .tbody { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .tbody::-webkit-scrollbar { display: none; }
  .tr { height: 31px; font-size: 13px; border-top: 1px solid var(--line-soft); }
  .tr > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r { text-align: right; }
  .tr .st { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .tr .st.warn { color: var(--warn); }
  .tr .up { color: var(--muted); }
  .empty { margin: auto; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; }

  /* Alerts */
  #alerts { flex-direction: column; }
  .alert { display: grid; grid-template-columns: 14px 110px 1fr; align-items: center; gap: 10px;
           height: 40px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .alert .h { color: var(--muted); }
  .alert:first-child { margin-top: 6px; }

  /* Sleep: a black cover over everything; the first touch only wakes the screen */
  #sleep { position: fixed; inset: 0; z-index: 100; background: #000; display: none; }
  body.asleep #sleep { display: block; }

  /* Info button and Pi status panel */
  #infoBtn { width: 40px; height: 40px; margin-left: 12px; flex: none; border: 1px solid var(--line); border-radius: 50%;
             color: var(--muted); font: italic 600 17px Georgia, serif; display: flex; align-items: center; justify-content: center; }
  #infoBtn.on { color: var(--text); border-color: #3A3E44; background: #1A1C20; }
  .muted { color: var(--muted); }
  .small { font-size: 11px; line-height: 1.4; }
  .btn { height: 36px; padding: 0 14px; border-radius: 6px; border: 1px solid #3A3E44; background: #1A1C20; font-size: 13px; }
  .btn:active, .key:active, .wrow:active { background: #2A2D33; }
  #info { gap: 28px; padding-top: 14px; }
  #info .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 11px; }
  h3 { margin: 0; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
  .kv span:first-child { color: var(--muted); white-space: nowrap; }
  .kv span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv .hl { color: var(--warn); }
  .net { padding: 7px 0 3px; border-top: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .net .top { display: flex; justify-content: space-between; font-size: 13px; }
  .net .dot { display: inline-block; margin-right: 6px; vertical-align: middle; }

  /* Wi-Fi setup: PIN pad, network list, touch keyboard */
  #wifi, #power { flex-direction: column; gap: 8px; padding-top: 10px; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .btn { flex: 1; height: 40px; }
  .pmenu { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; max-width: 420px; }
  .btn.big { height: 52px; font-size: 15px; }
  .btn.danger { border-color: #7A3B36; background: #3A1F1D; }
  .wtitle { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; min-height: 36px; }
  .wtitle .btn { margin-left: 6px; }
  .field { height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; display: flex; align-items: center;
           font-size: 16px; letter-spacing: .06em; overflow: hidden; white-space: nowrap; }
  .field.ph { color: var(--muted); letter-spacing: 0; font-size: 13px; }
  .werr { color: var(--down); font-size: 12px; }
  .keys { display: flex; flex-direction: column; gap: 4px; }
  .krow { display: flex; gap: 4px; justify-content: center; }
  .key { flex: 1; max-width: 70px; height: 40px; border-radius: 6px; background: #17191C; border: 1px solid var(--line); font-size: 16px; }
  .key.wide { flex: 1.6; max-width: 110px; font-size: 13px; }
  .key.space { flex: 6; max-width: none; font-size: 12px; color: var(--muted); }
  .key.go { flex: 2; max-width: 150px; background: #243B31; border-color: #3C6B58; font-size: 14px; }
  .key.on { background: #2A2D33; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 330px; margin: 2px auto 0; }
  .pad .key { max-width: none; height: 42px; }
  .wlist { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .wlist::-webkit-scrollbar { display: none; }
  .wrow { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 42px; padding: 0 4px;
          border-top: 1px solid var(--line-soft); font-size: 14px; text-align: left; }

  nav { height: 46px; flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid var(--line); margin: 0 -24px; padding: 0 24px; }
  nav button { font-size: 13px; color: var(--muted); }
  nav button.on { color: var(--text); font-weight: 500; box-shadow: inset 0 2px 0 var(--text); }
  nav .count { color: var(--warn); }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div><span class="title">Home Lab</span><span class="sub" id="summary">Connecting…</span><span class="sub stale" id="staleBadge" hidden></span></div>
    <div class="right">
      <div class="right" id="headerRight"><span class="clock" id="clock"></span></div>
      <button id="infoBtn" aria-label="Raspberry Pi status">i</button>
    </div>
  </header>

  <main>
    <section class="view" id="overview"></section>
    <section class="view" id="containers">
      <div class="table">
        <div class="thead"><span>Name</span><span>State</span><span class="r">CPU</span><span class="r">Memory</span><span class="r">Uptime</span></div>
        <div class="tbody" id="rows"></div>
      </div>
    </section>
    <section class="view" id="alerts"></section>
    <section class="view" id="info"></section>
    <section class="view" id="wifi"></section>
    <section class="view" id="power"></section>
    <div class="statusline" id="statusline"><span class="msg" id="statusmsg"></span><span id="updated"></span></div>
  </main>

  <nav id="nav">
    <button data-view="overview" class="on">Overview</button>
    <button data-view="containers">Containers</button>
    <button data-view="alerts" id="alertsTab">Alerts</button>
  </nav>
</div>

<div id="sleep"></div>

<script src="screen.js"></script>
<script>
(() => {
  const POLL_MS = 5000;
  const IDLE_RETURN_MS = 90000;   // go back to Overview after 90 s without a touch
  const STALE_S = 30;

  let state = null, view = "overview", selectedHost = null, lastTouch = Date.now(), fetchError = false;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const gb = (b) => b == null ? "—" : (b / 1024 ** 3).toFixed(1);

  // ---- scale the 800x480 layout to the actual screen
  function fit() {
    const s = Math.min(innerWidth / 800, innerHeight / 480);
    const st = $("stage");
    st.style.transform = `scale(${s})`;
    st.style.left = `${(innerWidth - 800 * s) / 2}px`;
    st.style.top = `${(innerHeight - 480 * s) / 2}px`;
  }
  addEventListener("resize", fit); fit();

  // ---- clock
  function tick() {
    const d = new Date(), el = $("clock");
    if (!el) return;
    el.textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  setInterval(tick, 1000); tick();

  // ---- navigation
  function show(v) {
    if (v !== "info" && v !== "wifi" && v !== "power") lastView = v;
    if (v !== "wifi") wifiReset();   // never keep a typed PIN or password around
    if (v !== "power") powerReset();
    view = v;
    if (v === "info") pollPi();
    $("infoBtn").classList.toggle("on", v === "info" || v === "wifi" || v === "power");
    document.querySelectorAll(".view").forEach((el) => el.classList.toggle("active", el.id === v));
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
    $("statusline").style.display = v === "overview" ? "flex" : "none";
    if (v === "wifi") renderWifi();
    if (v === "power") renderPower();
    render();
  }
  $("nav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.view); });
  document.addEventListener("pointerdown", () => { lastTouch = Date.now(); }, true);
  setInterval(() => { if (view !== "overview" && Date.now() - lastTouch > IDLE_RETURN_MS) show("overview"); }, 5000);

  // ---- screen sleep (schedule and idle timeout come from the "screen" block of config.json)
  let asleep = false, alertUntil = 0, seenAlerts = null, ignoreClicksUntil = 0, lastReport = { state: null, at: 0 };
  const screenCfg = () => (state && state.screen) || {};

  // Tell the Pi (screen-power.sh watches this) whether to switch the real display off.
  // Repeated every 30 s: if these stop, the Pi treats the screen as on, so a crash never leaves it dark.
  function reportScreen() {
    const s = asleep ? "off" : "on", now = Date.now();
    if (s === lastReport.state && now - lastReport.at < 30000) return;
    lastReport = { state: s, at: now };
    fetch("/api/screen", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ state: s }) }).catch(() => {});
  }
  function screenTick() {
    const sleepNow = HomelabScreen.shouldSleep(screenCfg(), Date.now(), lastTouch, alertUntil);
    if (sleepNow !== asleep) { asleep = sleepNow; document.body.classList.toggle("asleep", asleep); }
    reportScreen();
  }
  function wakeOnNewAlert() {   // a problem that was not there a moment ago wakes a sleeping screen
    if (!state) return;
    const keys = new Set(state.alerts.map((a) => `${a.host}|${a.text}`));
    if (seenAlerts && screenCfg().wake_on_alert && [...keys].some((k) => !seenAlerts.has(k))) {
      alertUntil = Date.now() + (screenCfg().wake_seconds || 60) * 1000;
      screenTick();
    }
    seenAlerts = keys;
  }
  $("sleep").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    lastTouch = Date.now();
    ignoreClicksUntil = lastTouch + 400;   // the touch that wakes the screen must not press a button underneath
    screenTick();
  });
  document.addEventListener("click", (e) => { if (Date.now() < ignoreClicksUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
  setInterval(screenTick, 1000);

  $("overview").addEventListener("click", (e) => {
    const h = e.target.closest(".host");
    if (h) { selectedHost = h.dataset.host; show("containers"); }
  });
  $("headerRight").addEventListener("click", (e) => {
    const p = e.target.closest(".pill");
    if (p) { selectedHost = p.dataset.host; render(); $("rows").scrollTop = 0; }
  });

  // ---- rendering
  const stateLabel = { ok: "Healthy", warn: "Attention", down: "Offline" };

  function metric(label, value, pct, hot) {
    return `<div class="metric${hot ? " hot" : ""}"><div class="row"><span>${esc(label)}</span><span>${esc(value)}</span></div>` +
           `<div class="bar"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%"></i></div></div>`;
  }

  function renderOverview() {
    const el = $("overview");
    el.style.gridTemplateColumns = `repeat(${Math.max(1, state.hosts.length)}, minmax(0, 1fr))`;
    el.innerHTML = state.hosts.map((h) => {
      const head = `<div class="top"><span class="name">${esc(h.name)}</span>` +
                   `<span class="state ${h.status === "ok" ? "" : h.status}"><span class="dot"></span>${stateLabel[h.status]}</span></div>`;
      if (!h.online) {
        return `<button class="host down" data-host="${esc(h.name)}">${head}<div class="offline">The agent at ${esc(h.address)} is not responding.<br>Check that the server is on and the glances-agent container is running.</div></button>`;
      }
      const disk = (h.disks && h.disks[0]) || null;
      const hotDisk = disk && h.alerts.some((a) => a.text.startsWith(`Disk ${disk.mount} `));
      const hotMem = h.alerts.some((a) => a.text.startsWith("Memory"));
      const hotTemp = h.alerts.some((a) => a.text.startsWith("CPU temperature"));
      const ctr = h.running === h.total ? `<b>${h.total}</b> containers` : `<b>${h.running}</b> of ${h.total} containers`;
      return `<button class="host" data-host="${esc(h.name)}">${head}
        <div><div class="big">${Math.round(h.cpu)}<small>%</small></div><div class="caption">CPU${h.uptime ? " · up " + esc(h.uptime) : ""}</div></div>
        <div class="metrics">
          ${metric("Memory", `${gb(h.mem_used)} / ${Math.round(h.mem_total / 1024 ** 3)} GB`, h.mem_pct, hotMem)}
          ${disk ? metric(disk.mount === "/" ? "Disk" : "Disk " + disk.mount, `${Math.round(disk.pct)}%`, disk.pct, hotDisk) : ""}
          ${h.temp != null ? metric("Temp", `${h.temp}°C`, h.temp, hotTemp) : ""}
        </div>
        <div class="foot"><span>${ctr}</span></div></button>`;
    }).join("");

    const msg = $("statusmsg");
    if (state.config_error) {
      msg.innerHTML = `<span class="bad">${esc(state.config_error)}</span>`;
    } else if (fetchError) {
      msg.innerHTML = `<span class="bad">Can't reach the dashboard service.</span> Check: systemctl status homelab-dashboard`;
    } else if (state.alerts.length) {
      const a = state.alerts[0];
      const more = state.alerts.length > 1 ? ` · ${state.alerts.length - 1} more in Alerts` : "";
      msg.innerHTML = `<span class="${a.level === "down" ? "bad" : "hl"}">${esc(a.host)}</span> · ${esc(a.text)}${more}`;
    } else {
      msg.textContent = "All systems normal";
    }
  }

  function renderContainers() {
    const hosts = state.hosts;
    if (!selectedHost || !hosts.find((h) => h.name === selectedHost)) {
      selectedHost = (hosts.find((h) => h.status !== "ok") || hosts[0] || {}).name;
    }
    $("headerRight").innerHTML = `<div class="pills">` + hosts.map((h) =>
      `<button class="pill${h.name === selectedHost ? " on" : ""}" data-host="${esc(h.name)}">${esc(h.name)}<span class="dot ${h.status === "ok" ? "" : h.status}"></span></button>`).join("") + `</div>`;
    const h = hosts.find((x) => x.name === selectedHost);
    $("summary").textContent = h && h.online ? `${h.running} of ${h.total} running` : "Offline";
    const rows = $("rows");
    if (!h || !h.online) { rows.innerHTML = `<div class="empty">No data from ${esc(selectedHost)}.</div>`; return; }
    if (!h.containers.length) { rows.innerHTML = `<div class="empty">No containers reported on this host.</div>`; return; }
    rows.innerHTML = h.containers.map((c) => {
      const cls = c.status === "running" ? "" : (c.status === "restarting" || c.status === "dead" || c.status === "exited") ? "warn" : "off";
      return `<div class="tr"><span>${esc(c.name)}</span>` +
        `<span class="st ${cls === "warn" ? "warn" : ""}"><span class="dot ${cls}"></span>${esc(c.status)}</span>` +
        `<span class="r">${esc(c.cpu)}</span><span class="r">${esc(c.mem)}</span><span class="r up">${esc(c.uptime)}</span></div>`;
    }).join("");
  }

  function renderAlerts() {
    const el = $("alerts");
    if (!state.alerts.length) { el.innerHTML = `<div class="empty">All systems normal.<br>Nothing needs your attention.</div>`; return; }
    el.innerHTML = state.alerts.map((a) =>
      `<div class="alert"><span class="dot ${a.level}"></span><span class="h">${esc(a.host)}</span><span>${esc(a.text)}</span></div>`).join("");
  }

  function render() {
    if (!state) return;
    const s = state.summary;
    if (view !== "containers") {
      $("headerRight").innerHTML = `<span class="clock" id="clock"></span>`; tick();
      $("summary").textContent = `${s.online} of ${s.hosts} hosts online · ${s.running} of ${s.total} containers running`;
    }
    const n = state.alerts.length;
    $("alertsTab").innerHTML = n ? `Alerts <span class="count">${n}</span>` : "Alerts";
    if (view === "overview") renderOverview();
    else if (view === "containers") renderContainers();
    else if (view === "info") renderInfo();
    else if (view === "wifi" || view === "power") { /* drawn on touch only, so a periodic redraw never eats a keypress */ }
    else renderAlerts();
    const age = state.updated ? Math.round(Date.now() / 1000 - state.updated) : null;
    const stale = age != null && age > STALE_S;
    $("updated").innerHTML = age == null ? "" : stale ? `<span class="hl">Data is ${age}s old</span>` : `Updated ${Math.max(0, age)}s ago`;
    // Visible on every view: a frozen screen must never look healthy
    const badge = $("staleBadge");
    badge.textContent = fetchError ? "· service unreachable" : stale ? `· stale (${age}s old)` : "";
    badge.hidden = !badge.textContent;
  }

  // ---- Pi info panel (the Pi that runs this dashboard)
  let piState = null, piError = false, lastView = "overview";
  const sigLabel = (d) => d == null ? "" : d >= -50 ? "excellent" : d >= -60 ? "good" : d >= -70 ? "fair" : "weak";
  const kv = (k, v, cls) => `<div class="kv"><span>${esc(k)}</span><span class="${cls || ""}">${esc(v ?? "—")}</span></div>`;

  async function pollPi() {
    try {
      const r = await fetch("/api/pi", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      piState = await r.json(); piError = false;
    } catch (e) { piError = true; }
    if (view === "info") renderInfo();
  }
  setInterval(() => { if (view === "info") pollPi(); }, POLL_MS);
  $("infoBtn").addEventListener("click", () => show(["info", "wifi", "power"].includes(view) ? lastView : "info"));

  function netRow(n) {
    const wifiNet = n.kind === "wifi";
    let detail;
    if (!n.up) detail = wifiNet ? "Not connected" : "No cable";
    else if (wifiNet) {
      detail = [n.ssid, n.signal != null ? `${n.signal} dBm (${sigLabel(n.signal)})` : null, n.bitrate ? `${n.bitrate} Mbps` : null]
        .filter(Boolean).join(" · ") || "Connected";
    } else detail = n.speed ? (n.speed >= 1000 ? `${n.speed / 1000} Gbps` : `${n.speed} Mbps`) : "Connected";
    return `<div class="net"><div class="top"><span><span class="dot ${n.up ? "" : "off"}"></span>${wifiNet ? "Wi-Fi" : "Ethernet"} <span class="muted">${esc(n.name)}</span></span>` +
           `<span>${esc(n.ip || "")}</span></div><div class="muted">${esc(detail)}</div></div>`;
  }

  function renderInfo() {
    const el = $("info");
    if (!piState) { el.innerHTML = `<div class="empty">${piError ? "Can't read the Pi's status." : "Loading…"}</div>`; return; }
    const p = piState, t = p.thresholds || {};
    const fan = p.fan && [p.fan.rpm != null ? `${p.fan.rpm} rpm` : "", p.fan.pct != null ? `${p.fan.pct}%` : ""].filter(Boolean).join(" · ");
    const hw = [
      metric("CPU", p.cpu != null ? `${Math.round(p.cpu)}%${p.mhz ? ` · ${p.mhz} MHz` : ""}` : "—", p.cpu, p.cpu >= t.cpu_warn),
      p.mem ? metric("Memory", `${gb(p.mem.used)} / ${gb(p.mem.total)} GB`, p.mem.pct, p.mem.pct >= t.mem_warn) : "",
      p.disk ? metric("Disk", `${gb(p.disk.used)} / ${gb(p.disk.total)} GB`, p.disk.pct, p.disk.pct >= t.disk_warn) : "",
      p.temp != null ? metric("Temp", `${p.temp}°C`, p.temp, p.temp >= t.temp_warn) : "",
      p.fan ? metric("Fan", fan || "on", p.fan.pct) : kv("Fan", "none detected"),
    ].join("");
    const power = p.power ? kv("Power", p.power.text, p.power.level === "ok" ? "" : "hl") : "";
    const nets = (p.network || []).map(netRow).join("") || `<div class="muted small">No network interfaces found.</div>`;
    const buttons = [
      p.wifi_setup === "ready" ? `<button class="btn" data-act="wifi">Wi-Fi settings</button>` : "",
      p.power_setup === "ready" ? `<button class="btn" data-act="power">Power</button>` : "",
    ].join("");
    const setup = buttons ? `<div class="btnrow">${buttons}</div>`
      : p.wifi_setup === "no_pin" ? `<div class="muted small">Wi-Fi and power controls are off. Set "pin" in config.json to enable them here.</div>` : "";
    el.innerHTML = `<div class="col"><h3>Hardware</h3><div class="metrics">${hw}</div>${power}</div>
      <div class="col"><h3>Network</h3><div>${nets}</div>${setup}
        <h3>System</h3>${kv("Host", p.hostname)}${kv("Model", p.model)}${kv("OS", p.os)}${kv("Uptime", p.uptime)}${kv("Load", p.load1 != null ? `${p.load1} · ${p.cores} cores` : null)}</div>`;
  }
  $("info").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b) show(b.dataset.act);
  });

  // ---- Wi-Fi setup on the touchscreen (PIN pad, network list, keyboard)
  const KEYS = {
    abc: ["1234567890", "qwertyuiop", "asdfghjkl", "zxcvbnm"],
    sym: ["1234567890", "!@#$%^&*()", "-_=+[]{}|\\", ";:'\",.<>/?"],
  };
  let wifi = null;
  function wifiReset() {
    wifi = { step: "pin", pin: "", nets: [], ssid: "", hidden: false, text: "", shift: false, sym: false, reveal: false, msg: "", busy: false, ok: false };
  }
  wifiReset();

  async function wifiApi(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: wifi.pin, ...body }) });
    let data = {};
    try { data = await r.json(); } catch (e) { /* non-JSON error page */ }
    if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
    return data;
  }
  const keyBtn = (k, label, cls) => `<button class="key ${cls || ""}" data-k="${esc(k)}">${esc(label ?? k)}</button>`;

  function keyboard(okLabel) {
    const upper = wifi.shift && !wifi.sym;
    const rows = (wifi.sym ? KEYS.sym : KEYS.abc).map((r, i) => {
      const chars = [...r].map((c) => keyBtn(upper ? c.toUpperCase() : c)).join("");
      return i === 3
        ? `<div class="krow">${wifi.sym ? "" : keyBtn("{shift}", "⇧", wifi.shift ? "on" : "")}${chars}${keyBtn("{bs}", "⌫")}</div>`
        : `<div class="krow">${chars}</div>`;
    }).join("");
    return `<div class="keys">${rows}<div class="krow">${keyBtn("{sym}", wifi.sym ? "ABC" : "?123", "wide")}${keyBtn(" ", "space", "space")}${keyBtn("{ok}", okLabel, "go")}</div></div>`;
  }

  function renderWifi() {
    const w = wifi, el = $("wifi"), back = `<button class="btn" data-w="back">Back</button>`;
    let html;
    if (w.step === "pin") {
      html = pinHtml("Wi-Fi settings", back, w, "Checking the PIN and scanning for networks… (about 10 s)");
    } else if (w.step === "list" && w.busy) {
      html = `<div class="wtitle"><span>Choose a network</span></div>` +
        `<div class="empty">Scanning for networks…<br><span class="muted">This takes about 10 seconds.</span></div>`;
    } else if (w.step === "list") {
      html = `<div class="wtitle"><span>Choose a network</span><span><button class="btn" data-w="rescan">Rescan</button>${back}</span></div>` +
        (w.msg ? `<div class="werr">${esc(w.msg)}</div>` : "") +
        `<div class="wlist">${w.nets.map((n, i) => `<button class="wrow" data-w="net" data-i="${i}"><span>${n.active ? "● " : ""}${esc(n.ssid)}</span>` +
          `<span class="muted">${n.secure ? "Secured" : "Open"} · ${n.signal}%</span></button>`).join("")}` +
        `<button class="wrow" data-w="other"><span>Other network…</span><span class="muted">hidden or not listed</span></button></div>`;
    } else if (w.step === "ssid" || w.step === "password") {
      const isPw = w.step === "password";
      const shown = isPw && !w.reveal ? "•".repeat(w.text.length) : w.text;
      html = `<div class="wtitle"><span>${isPw ? `Password for ${esc(w.ssid)}` : "Network name"}</span><span>` +
        (isPw ? `<button class="btn" data-w="reveal">${w.reveal ? "Hide" : "Show"}</button>` : "") + `${back}</span></div>` +
        `<div class="field${shown ? "" : " ph"}">${shown ? esc(shown) : (isPw ? "Type the password" : "Type the network name")}</div>` +
        keyboard(isPw ? "Connect" : "Next");
    } else if (w.step === "connecting") {
      html = `<div class="empty">Connecting to ${esc(w.ssid)}…<br><span class="muted">This can take up to 45 seconds.</span></div>`;
    } else {
      html = `<div class="empty">${w.ok ? `Connected to ${esc(w.ssid)}.` : `<span class="werr">${esc(w.msg)}</span>`}<br><br>` +
        (w.ok ? "" : `<button class="btn" data-w="retry">Try again</button> `) + `<button class="btn" data-w="done">Done</button></div>`;
    }
    el.innerHTML = html;
  }

  async function wifiScan() {
    wifi.busy = true; wifi.msg = ""; renderWifi();
    try {
      wifi.nets = (await wifiApi("/api/wifi/scan", {})).networks;
      wifi.step = "list";
    } catch (e) { wifi.msg = e.message; wifi.pin = ""; wifi.step = "pin"; }
    wifi.busy = false; renderWifi();
  }

  async function wifiConnect(password) {
    wifi.step = "connecting"; renderWifi();
    try { await wifiApi("/api/wifi/connect", { ssid: wifi.ssid, password, hidden: wifi.hidden }); wifi.ok = true; wifi.msg = ""; }
    catch (e) { wifi.ok = false; wifi.msg = e.message; }
    wifi.step = "done"; wifi.text = ""; renderWifi();
  }

  function wifiKey(k) {
    if (wifi.busy) return;
    if (wifi.step === "pin") {
      if (k === "{bs}") wifi.pin = wifi.pin.slice(0, -1);
      else if (k === "{ok}") { if (wifi.pin.length >= 4) return wifiScan(); }
      else if (/^\d$/.test(k) && wifi.pin.length < 8) wifi.pin += k;
      return renderWifi();
    }
    if (k === "{bs}") wifi.text = wifi.text.slice(0, -1);
    else if (k === "{shift}") wifi.shift = !wifi.shift;
    else if (k === "{sym}") { wifi.sym = !wifi.sym; wifi.shift = false; }
    else if (k === "{ok}") {
      if (wifi.step === "ssid") {
        if (!wifi.text) return;
        wifi.ssid = wifi.text; wifi.hidden = true; wifi.text = ""; wifi.reveal = false; wifi.step = "password";
      } else return wifiConnect(wifi.text);
    } else { if (wifi.text.length < 63) wifi.text += k; wifi.shift = false; }
    renderWifi();
  }

  $("wifi").addEventListener("click", (e) => {
    const key = e.target.closest("[data-k]");
    if (key) return wifiKey(key.dataset.k);
    const b = e.target.closest("[data-w]");
    if (!b || wifi.busy) return;
    const act = b.dataset.w;
    if (act === "back") {
      if (wifi.step === "password") { wifi.step = wifi.hidden ? "ssid" : "list"; wifi.text = ""; }
      else if (wifi.step === "ssid") wifi.step = "list";
      else return show("info");
    } else if (act === "done") return show("info");
    else if (act === "retry") { wifi.step = "password"; }
    else if (act === "rescan") return wifiScan();
    else if (act === "reveal") wifi.reveal = !wifi.reveal;
    else if (act === "other") { wifi.ssid = ""; wifi.hidden = true; wifi.text = ""; wifi.step = "ssid"; }
    else if (act === "net") {
      const n = wifi.nets[+b.dataset.i];
      wifi.ssid = n.ssid; wifi.hidden = false; wifi.text = ""; wifi.reveal = false;
      if (!n.secure) return wifiConnect("");
      wifi.step = "password";
    }
    renderWifi();
  });
  // ---- shared PIN pad (Wi-Fi settings and the power menu use the same PIN)
  function pinHtml(title, backBtn, st, busyText) {
    const dots = st.busy ? busyText : "●".repeat(st.pin.length) || "Enter the PIN";
    return `<div class="wtitle"><span>${esc(title)}</span>${backBtn}</div><div class="field${st.pin && !st.busy ? "" : " ph"}">${dots}</div>` +
      (st.msg ? `<div class="werr">${esc(st.msg)}</div>` : "") +
      `<div class="pad">${"123456789".split("").map((n) => keyBtn(n)).join("")}${keyBtn("{bs}", "⌫")}${keyBtn("0")}${keyBtn("{ok}", "OK", "go")}</div>`;
  }

  // ---- power menu: reboot, shut down, restart the dashboard (PIN, then a confirm step)
  const POWER_TEXT = {
    reboot: { label: "Reboot", ask: "Reboot the Pi?", detail: "The dashboard will be unavailable for about a minute.",
              done: "Rebooting. The screen goes dark and comes back in about a minute." },
    shutdown: { label: "Shut down", ask: "Shut the Pi down?", detail: "To start it again, unplug and replug the power (or press its power button).",
                done: "Shutting down. Wait about 10 seconds before unplugging." },
    restart: { label: "Restart dashboard", ask: "Restart the dashboard service?", detail: "The screen reloads in a few seconds. Your servers are not affected.",
               done: "Restarting. The page reloads in a moment." },
  };
  let power = null;
  function powerReset() { power = { step: "pin", pin: "", msg: "", busy: false, action: "", ok: false }; }
  powerReset();

  async function powerApi(action) {
    const r = await fetch("/api/power", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: power.pin, action }) });
    let data = {};
    try { data = await r.json(); } catch (e) { /* non-JSON error page */ }
    if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
    return data;
  }

  function renderPower() {
    const p = power, el = $("power"), back = `<button class="btn" data-p="back">Back</button>`;
    let html;
    if (p.step === "pin") html = pinHtml("Power", back, p, "Checking the PIN…");
    else if (p.step === "menu") {
      html = `<div class="wtitle"><span>Power</span>${back}</div><div class="pmenu">` +
        ["reboot", "shutdown", "restart"].map((a) => `<button class="btn big" data-p="ask" data-a="${a}">${esc(POWER_TEXT[a].label)}</button>`).join("") +
        `<button class="btn big" data-p="reload">Reload this page</button></div>`;
    } else if (p.step === "confirm") {
      const t = POWER_TEXT[p.action];
      html = `<div class="wtitle"><span>${esc(t.ask)}</span></div><div class="muted">${esc(t.detail)}</div>` +
        `<div class="pmenu"><button class="btn big danger" data-p="do">${esc(t.label)}</button><button class="btn big" data-p="menu">Cancel</button></div>`;
    } else if (p.step === "working") html = `<div class="empty">${esc(POWER_TEXT[p.action].label)}…</div>`;
    else html = p.ok ? `<div class="empty">${esc(POWER_TEXT[p.action].done)}</div>`
      : `<div class="empty"><span class="werr">${esc(p.msg)}</span><br><br><button class="btn" data-p="menu">Back to menu</button></div>`;
    el.innerHTML = html;
  }

  async function powerCheck() {
    power.busy = true; power.msg = ""; renderPower();
    try { await powerApi("check"); power.step = "menu"; }
    catch (e) { power.msg = e.message; power.pin = ""; }
    power.busy = false; renderPower();
  }

  async function powerRun(action) {
    if (power.step === "working") return;
    power.step = "working"; power.action = action; renderPower();
    try { await powerApi(action); power.ok = true; power.msg = ""; }
    catch (e) {
      // restarting the service kills the connection before it can answer: that is success
      power.ok = action === "restart" && e instanceof TypeError;
      power.msg = e.message;
    }
    power.step = "done"; renderPower();
    if (power.ok && action === "restart") setTimeout(() => location.reload(), 6000);
  }

  $("power").addEventListener("click", (e) => {
    const key = e.target.closest("[data-k]");
    if (key) {
      const k = key.dataset.k;
      if (power.busy || power.step !== "pin") return;
      if (k === "{bs}") power.pin = power.pin.slice(0, -1);
      else if (k === "{ok}") { if (power.pin.length >= 4) return powerCheck(); }
      else if (/^\d$/.test(k) && power.pin.length < 8) power.pin += k;
      return renderPower();
    }
    const b = e.target.closest("[data-p]");
    if (!b || power.busy) return;
    const act = b.dataset.p;
    if (act === "back") return show("info");
    if (act === "reload") return location.reload();
    if (act === "do") return powerRun(power.action);
    if (act === "menu") power.step = "menu";
    else if (act === "ask") { power.action = b.dataset.a; power.step = "confirm"; }
    renderPower();
  });

  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      state = await r.json();
      fetchError = false;
      wakeOnNewAlert();
    } catch (e) {
      fetchError = true;
    }
    render();
  }
  setInterval(poll, POLL_MS);
  setInterval(render, 1000 * 5);
  poll();
  // Optional deep link (e.g. http://pi:8080/#alerts), handy for screenshots
  const startView = location.hash.slice(1);
  show(["containers", "alerts", "info", "wifi", "power"].includes(startView) ? startView : "overview");
})();
</script>
</body>
</html>
