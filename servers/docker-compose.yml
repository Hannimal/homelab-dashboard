# Glances agent: exposes this host's system + Docker stats as a read-only JSON API on :61208
services:
  glances:
    image: nicolargo/glances:4.5.8   # pinned: the dashboard reads the /api/4 JSON shapes
    container_name: glances-agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pid: host               # see host processes, not just the container's
    network_mode: host       # report real host network interfaces
    environment:
      - GLANCES_OPT=-w --disable-webui -C /glances/conf/glances.conf
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # container list + stats
      - /etc/os-release:/etc/os-release:ro             # correct OS name
      - ./glances.conf:/glances/conf/glances.conf:ro
      # Optional: expose extra host disks so their usage is reported, e.g.
      # - /mnt/data:/host/data:ro
