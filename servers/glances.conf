# Minimal Glances config for the home lab dashboard agent.
[global]
check_update=false

[containers]
disable=False
# Report stopped / exited containers too, so the dashboard can flag them
all=True

[sensors]
# CPU temperature comes from the host's /sys/class/hwmon and /sys/class/thermal,
# which the container sees without extra flags. Battery and fan readings are noise here.
disable=False
hide=.*battery.*,.*fan.*

[fs]
# Hide noise from boot / snap / docker-internal mounts
hide=/boot.*,/snap.*,/var/lib/docker/.*
